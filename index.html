<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b3558">
    
    <title>Hablá Salta - Traductor de Voz para Turistas en Salta</title>
    <meta name="description" content="Herramienta de traducción de voz gratuita para turistas y locales en Salta, Argentina. Hablá y entendé en español, inglés y portugués al instante.">
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Hablá Salta</h1>
            <p>Traducción de voz para turistas y locales</p>
        </header>

        <main>
            <div class="language-selector">
                <button id="btn-lang-es-EN" class="lang-btn active">Español ↔ Inglés</button>
                <button id="btn-lang-es-PT" class="lang-btn">Español ↔ Portugués</button>
            </div>

            <div class="status-area">
                <p id="status-text">Presioná el botón para hablar</p>
                <div id="error-message" class="error hidden"></div>
            </div>

            <div class="button-container">
                <button id="btn-hablar" class="mic-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
            </div>

            <div class="result-area">
                <h2 id="result-title">Traducción:</h2>
                <p id="translation-result"></p>
            </div>

            <div id="intent-response" class="intent-response hidden"></div>

            <div id="map-container" class="map-container hidden">
                <h2 id="map-title">Lugares cercanos</h2>
                <div id="map"></div>
                <ul id="places-list" class="places-list"></ul>
            </div>
        </main>

        <footer>
            <p>Hecho con ❤️ en Salta</p>
        </footer>
    </div>

    <!-- Leaflet JS (debe ir ANTES de script.js) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
