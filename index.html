<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b3558">

    <title>Hablá Salta - Traductor de Voz para Turistas en Salta</title>
    <meta name="description" content="Herramienta de traducción de voz gratuita para turistas y locales en Salta, Argentina. Hablá y entendé en varios idiomas al instante.">

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <header>
            <p class="subtitulo">SALTA · ARGENTINA</p>
            <h1>Hablá Salta</h1>
            <p class="descripcion">Decí lo que necesitás, escuchá la traducción y entendé a tus visitantes.</p>
        </header>

        <main class="card">
            <div class="form-group">
                <label for="idioma">Idioma que habla la otra persona</label>
                <select id="idioma">
                    <option value="auto">🌐 Detectar automáticamente</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="pt">🇧🇷 Português</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="de">🇩🇪 Deutsch</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="zh">🇨🇳 中文</option>
                    <option value="ja">🇯🇵 日本語</option>
                    <option value="ru">🇷🇺 Русский</option>
                    <option value="he">🇮🇱 עברית</option>
                </select>
                <p class="nota">La traducción siempre se muestra en español.</p>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="texto-entrada">¿Qué quiere decir?</label>
                    <button id="btn-hablar" class="btn-hablar">🎙️ Hablar</button>
                </div>
                <textarea id="texto-entrada" placeholder="Escribí o dictá la frase..."></textarea>
                <p id="status-text" class="status-text">Presioná "Hablar" para dictar.</p>
            </div>

            <button id="btn-traducir" class="btn-traducir">Traducir ahora</button>

            <div id="resultado" class="resultado hidden">
                <p class="resultado-label">TRADUCCIÓN</p>
                <p id="translation-result" class="resultado-texto"></p>
                <div class="resultado-botones">
                    <button id="btn-escuchar" class="btn-secundario">🔊 Escuchar</button>
                    <button id="btn-copiar" class="btn-secundario">Copiar</button>
                </div>
            </div>

            <div id="intent-response" class="intent-response hidden"></div>

            <div id="map-container" class="map-container hidden">
                <h2 id="map-title">Lugares cercanos</h2>
                <div id="map"></div>
                <ul id="places-list" class="places-list"></ul>
            </div>
        </main>

        <footer>
            <p>bizcochito &lt;3</p>
        </footer>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
