name: Versión y APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  apk:
    # Los commits que hace este mismo proceso no lo vuelven a disparar
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular número de versión
        id: ver
        run: |
          # Cantidad de cambios hechos a mano (sin contar los de este proceso)
          N=$(git rev-list --count HEAD --invert-grep --grep='\[skip ci\]')
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "window.APP_VERSION = \"$N\";" > version.js
          cat version.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace -PappVersionCode=${{ steps.ver.outputs.n }} -PappVersionName=${{ steps.ver.outputs.n }}

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HablaSalta.apk

      - name: Guardar el número en la web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.js
          if ! git diff --cached --quiet; then
            git commit -m "Versión ${{ steps.ver.outputs.n }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publicar descarga del APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk HablaSalta.apk \
            --title "Hablá Salta v${{ steps.ver.outputs.n }}" \
            --notes "Versión **${{ steps.ver.outputs.n }}**. Es el mismo número que se ve en la esquina inferior derecha de la web y de la app." \
            --latest
