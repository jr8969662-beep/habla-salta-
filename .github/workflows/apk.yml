name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace -PappVersionCode=${{ github.run_number }} -PappVersionName=1.${{ github.run_number }}

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HablaSalta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HablaSalta-apk
          path: HablaSalta.apk

      - name: Publicar descarga
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk HablaSalta.apk \
            --title "Hablá Salta v1.${{ github.run_number }}" \
            --notes "Versión **1.${{ github.run_number }}**. Descargá HablaSalta.apk desde el teléfono e instalalo encima de la anterior. La misma versión se ve en la esquina inferior derecha de la app. Cambio: ${GITHUB_SHA::7}." \
            --latest
